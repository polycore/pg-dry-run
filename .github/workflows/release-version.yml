# Release Version
#
# Driven by Changesets. Two modes, gated automatically by whether the repo
# currently has unconsumed changeset files in `.changeset/*.md`:
#
#   1. PRs to `main` add changesets. After they merge:
#        → If new changesets exist, the action opens or updates a
#          "chore: version packages" PR that bumps `package.json`, regenerates
#          `CHANGELOG.md`, removes the consumed `.changeset/*.md` files, and
#          refreshes `pnpm-lock.yaml`.
#   2. When that PR merges:
#        → The action runs `pnpm changeset:tag`, which creates the git tag
#          `pgpreview@X.Y.Z`. Tags are created via the GitHub Releases API
#          (`commitMode: github-api`) so they trigger `release-npm.yml`. The
#          default `GITHUB_TOKEN` cannot trigger other workflows, so this needs
#          `RELEASE_PAT`, a fine-grained PAT with `contents: write` and
#          `pull-requests: write`.
#
# Humans never type a version number; the bump type comes from the changeset
# markdown each PR carries.
#
# Required repo secret: RELEASE_PAT

name: Release Version

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-version
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    name: Open/update Version PR · create tag on merge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Version PR or push the release tag
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:tag
          commit: "chore: version packages"
          title: "chore: version packages"
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
