# Release
#
# Driven by Changesets. One workflow, two modes, gated automatically by whether
# the repo currently has unconsumed changeset files in `.changeset/*.md`:
#
#   1. PRs to `main` add changesets. After they merge:
#        → If new changesets exist, the action opens or updates a
#          "chore: version packages" PR that bumps `package.json`, regenerates
#          `CHANGELOG.md`, removes the consumed `.changeset/*.md` files, and
#          refreshes `pnpm-lock.yaml`.
#   2. When that PR merges:
#        → No changesets are left, so the action runs `pnpm changeset:publish`,
#          which publishes to npm and creates the `pg-dry-run@X.Y.Z` git tag.
#
# Humans never type a version number; the bump type comes from the changeset
# markdown each PR carries.
#
# Publishing lives in this workflow rather than in a separate tag-triggered one,
# so there is no tag handoff between workflows to arrange.
#
# RELEASE_PAT rather than GITHUB_TOKEN, for a reason that is org policy and not
# a preference: this organization disables write permissions for workflows, so
# GITHUB_TOKEN cannot open the "chore: version packages" pull request and the
# run fails with "GitHub Actions is not permitted to create or approve pull
# requests". The repo-level toggle for this is refused with a 409 while the org
# setting stands, and loosening it org-wide would hand every workflow in every
# repo the ability to push code and approve its own PRs.
#
# It also means that PR gets its own CI run, which a GITHUB_TOKEN-opened PR does
# not, so branch protection requiring checks stays workable.
#
# Provenance is off. npm rejects it from a private repository, and this one is
# private for now. When the repo goes public, add `NPM_CONFIG_PROVENANCE: "true"`
# back to the publish step's env; `id-token: write` is already granted below, so
# that is the only change needed.
#
# Required secrets:
#   NPM_TOKEN   — npm token with publish rights on `pg-dry-run` (org secret).
#   RELEASE_PAT — fine-grained PAT with `contents: write` and
#                 `pull-requests: write` on this repo. Worth adding as an org
#                 secret: every repo in this org hits the same policy.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Open/update the Version PR · publish on merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Publishing an untested build is how a broken release happens. The suite
      # is hermetic and takes seconds, so gate on it here too rather than
      # trusting that CI already ran on the merged commit.
      - name: Verify
        run: pnpm verify

      - name: Create the Version PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
